<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Cloud Sedang AFK 😴 | FmcStore</title>
  <meta name="description" content="Halaman tidak ditemukan. Kembali ke Fmc CLOUD untuk sewa Cloud Phone AFK 24/7.">
  
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2E5E4E;
      --accent: #C5A467;
      --text-main: #3E3A33;
      --text-muted: #6B675E;
      --bg: #F8F4ED;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(139, 122, 102, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(62, 58, 51, 0.08);
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 20px;
      color: var(--primary);
      opacity: 0.9;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 4rem;
      margin: 0 0 10px;
      color: var(--primary);
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .status {
      background: rgba(46, 94, 78, 0.08);
      color: var(--primary);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 30px;
      font-weight: 600;
      margin: 15px 0;
      border: 1px solid var(--primary);
    }

    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .btn:hover {
      background: #3A6B5F;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(46, 94, 78, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      h1 { font-size: 3rem; }
      h2 { font-size: 1.5rem; }
      .container { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <i class="fas fa-cloud-meatball"></i>
    </div>

    <h1>404</h1>
    <h2>Halaman Tidak Ditemukan…</h2>

    <p>
      <i class="fas fa-robot" style="color: var(--accent); margin-right: 6px;"></i>
      Halaman yang kamu tuju tidak ditemukan.
    </p>

    <div class="status">
      <i class="fas fa-check-circle" style="margin-right: 6px;"></i> Fmc CLOUD: Online & Ready
    </div>

    <a href="/" class="btn">
      <i class="fas fa-home"></i> Kembali ke Awal
    </a>

    <a href="https://wa.me/6288708644467" class="btn btn-outline" style="display: block; margin-top: 12px;">
      <i class="fab fa-whatsapp"></i> Chat Admin Langsung
    </a>

    <div class="footer-note">
      Butuh bantuan? Cek <a href="/">produk cloud</a> atau hubungi kami via WhatsApp!
    </div>
  </div>

  <!-- Optional: Background subtle glow -->
  <div style="
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 30% 50%, rgba(197, 164, 103, 0.03), transparent 30%);
    pointer-events: none;
    z-index: -1;
  "></div>
</body>
</html>
